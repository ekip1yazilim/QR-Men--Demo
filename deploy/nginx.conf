# Nginx ters vekil örneği (HTTPS için certbot: sudo certbot --nginx -d lezzetduragi.com)
# /etc/nginx/sites-available/dijital-menu

server {
    listen 80;
    server_name lezzetduragi.com www.lezzetduragi.com;
    return 301 https://lezzetduragi.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lezzetduragi.com;

    # certbot bu satırları otomatik ekler:
    # ssl_certificate     /etc/letsencrypt/live/lezzetduragi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lezzetduragi.com/privkey.pem;

    # Görsel yükleme sınırı (uygulamadaki MAX_UPLOAD_MB ile uyumlu)
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
